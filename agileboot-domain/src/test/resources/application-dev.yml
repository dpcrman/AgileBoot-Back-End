# 数据源配置
spring:
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        driverClassName: org.postgresql.Driver
        druid:
            webStatFilter:
                enabled: true
            statViewServlet:
                enabled: true
                allow:
                url-pattern: /druid/*
                login-username: agileboot
                login-password: 123456
            filter:
                stat:
                    enabled: true
                    log-slow-sql: true
                    slow-sql-millis: 1000
                    merge-sql: true
                wall:
                    config:
                        multi-statement-allow: true
        dynamic:
            primary: master
            strict: false
            druid:
                initialSize: 5
                minIdle: 10
                maxActive: 20
                maxWait: 60000
                timeBetweenEvictionRunsMillis: 60000
                minEvictableIdleTimeMillis: 300000
                maxEvictableIdleTimeMillis: 900000
                validationQuery: SELECT 1
                testWhileIdle: true
                testOnBorrow: false
                testOnReturn: false
            datasource:
                master:
                    url: jdbc:postgresql://192.168.31.221:5432/agileboot?currentSchema=app&stringtype=unspecified
                    username: postgres
                    password: asd123456@

    # redis 配置
    data:
        redis:
            host: 192.168.31.221
            port: 6379
            database: 1
            password: uG3dB1aF0eD3mF2bE1bC
            timeout: 10s
            lettuce:
                pool:
                    min-idle: 0
                    max-idle: 8
                    max-active: 8
                    max-wait: -1ms
